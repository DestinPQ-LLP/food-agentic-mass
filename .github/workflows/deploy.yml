name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Secrets required:
#   AZURE_CREDENTIALS              — SDK-auth JSON from `az ad sp create-for-rbac --sdk-auth`
#   AZURE_STORAGE_CONN_STR         — storage account connection string ($web container)
#   AZURE_WEBAPP_PUBLISH_PROFILE   — App Service publish profile (XML)
#   AZURE_RESOURCE_GROUP           — defaults to food-agentic-mass-rg
#   AZURE_STORAGE_ACCOUNT          — defaults to foodagenticmasscdn
#   AZURE_CDN_PROFILE_NAME         — defaults to food-agentic-mass-cdn-profile
#   AZURE_CDN_ENDPOINT_NAME        — defaults to food-agentic-mass
#   AZURE_WEBAPP_NAME              — defaults to food-agentic-mass-api

env:
  AZURE_STORAGE_ACCOUNT:    ${{ vars.AZURE_STORAGE_ACCOUNT  || 'foodagenticmasscdn' }}
  AZURE_RESOURCE_GROUP:     ${{ vars.AZURE_RESOURCE_GROUP   || 'food-agentic-mass-rg' }}
  AZURE_CDN_PROFILE_NAME:   ${{ vars.AZURE_CDN_PROFILE_NAME || 'food-agentic-mass-cdn-profile' }}
  AZURE_CDN_ENDPOINT_NAME:  ${{ vars.AZURE_CDN_ENDPOINT_NAME || 'food-agentic-mass' }}
  AZURE_WEBAPP_NAME:        ${{ vars.AZURE_WEBAPP_NAME      || 'food-agentic-mass-api' }}

jobs:
  # ---------------------------------------------------------------------------
  # Backend → Azure App Service
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy NestJS API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm prune --omit=dev

      - name: Zip artifact
        run: |
          cp package.json package-lock.json dist/
          cp -R node_modules dist/
          (cd dist && zip -qr ../api.zip .)

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend/api.zip

  # ---------------------------------------------------------------------------
  # Frontends → Azure Blob $web   (matrix over 14 categories)
  # ---------------------------------------------------------------------------
  deploy-frontends:
    name: Deploy ${{ matrix.category }} pages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        category:
          - a-owner
          - b-pos
          - c-customer-crm
          - d-whatsapp
          - e-kitchen
          - f-inventory
          - g-vendor
          - h-quality
          - i-staff
          - j-accounts
          - k-delivery
          - l-cctv
          - m-ai-support
          - n-multi-branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve IDs in this category
        id: ids
        run: |
          ids=$(python3 -c "
          import json
          m = json.load(open('scripts/offerings-manifest.json'))
          ids = [o['idLower'] for o in m['offerings'] if o['categorySlug'] == '${{ matrix.category }}']
          print(' '.join(ids))
          ")
          echo "ids=$ids" >> $GITHUB_OUTPUT

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload pages in ${{ matrix.category }}
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONN_STR }}
        run: |
          for id in ${{ steps.ids.outputs.ids }}; do
            echo "↑ offerings/$id"
            az storage blob upload-batch \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --destination "\$web/offerings/$id" \
              --source "frontend/offerings/$id" \
              --overwrite --output none
          done

      - name: Purge CDN for ${{ matrix.category }}
        run: |
          for id in ${{ steps.ids.outputs.ids }}; do
            az cdn endpoint purge \
              --name "$AZURE_CDN_ENDPOINT_NAME" \
              --profile-name "$AZURE_CDN_PROFILE_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --content-paths "/offerings/$id/*" \
              --no-wait
          done

  # ---------------------------------------------------------------------------
  # Catalogue index page (once)
  # ---------------------------------------------------------------------------
  deploy-catalogue:
    name: Deploy offerings catalogue index
    runs-on: ubuntu-latest
    needs: deploy-frontends
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Upload catalogue
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONN_STR }}
        run: |
          az storage blob upload \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name '$web' \
            --name 'offerings/index.html' \
            --file 'frontend/offerings/index.html' \
            --overwrite --output none
          az cdn endpoint purge \
            --name "$AZURE_CDN_ENDPOINT_NAME" \
            --profile-name "$AZURE_CDN_PROFILE_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --content-paths "/offerings/index.html" \
            --no-wait
